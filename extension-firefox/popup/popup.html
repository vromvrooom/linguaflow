<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --paper:  #fafafa;
      --card:   #ffffff;
      --line:   #e4e4e7;
      --ink:    #09090b;
      --dim:    #71717a;
      --brand:  #18181b;
      --brand-dark: #000000;
      --brand-soft: #f4f4f5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 360px;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      flex-shrink: 0;
    }
    .logo {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      flex: 1;
    }
    /* popup.js writes "● Не підключено" / "● Підключено" here and toggles
       .connected, so the bullet itself is the status dot. */
    .status {
      font-size: 11px;
      font-weight: 600;
      color: var(--dim);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      white-space: nowrap;
    }
    .status.connected {
      color: var(--brand);
      background: var(--brand-soft);
      border-color: #d4d4d8;
    }

    /* ── Stats ──────────────────────────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .stat-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--dim);
      margin-bottom: 6px;
    }
    .stat-label svg { flex-shrink: 0; }
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    /* ── Buttons ────────────────────────────────────────────────────────── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 11px;
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 200ms ease, border-color 200ms ease, transform 200ms ease;
    }
    .btn + .btn { margin-top: 8px; }
    .btn:active { transform: scale(0.98); }

    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-dark); }

    .btn-secondary {
      background: transparent;
      color: var(--dim);
      border-color: var(--line);
    }
    .btn-secondary:hover { color: var(--ink); background: var(--card); }

    .btn-link {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 0;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--brand);
      text-align: center;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .btn-link:hover { color: var(--brand-dark); }

    /* ── Logged-out ─────────────────────────────────────────────────────── */
    .login-hint {
      font-size: 12px;
      line-height: 1.5;
      color: var(--dim);
      margin-bottom: 12px;
    }
    .login-section input {
      width: 100%;
      padding: 11px 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      margin-bottom: 10px;
      transition: border-color 200ms ease, box-shadow 200ms ease;
    }
    .login-section input::placeholder { color: var(--dim); }
    .login-section input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(24, 24, 27, 0.12);
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/>
        <path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>
      </svg>
    </span>
    <span class="logo">LinguaFlow</span>
    <span class="status" id="status">● Не підключено</span>
  </div>

  <div id="logged-out" class="login-section">
    <p class="login-hint" id="login-hint">
      Вставте JWT токен з вашого акаунту LinguaFlow або увійдіть через сайт
    </p>
    <input type="text" id="token-input" placeholder="JWT токен...">
    <button class="btn btn-primary" id="connect-btn">Підключити</button>
    <button class="btn-link" id="open-login-btn">Відкрити сайт</button>
  </div>

  <div id="logged-in" style="display:none">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
          </svg>
          Streak
        </div>
        <div class="stat-value" id="streak">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 2v8l3-3 3 3V2"/>
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/>
          </svg>
          Слів
        </div>
        <div class="stat-value" id="words">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          Хвилин
        </div>
        <div class="stat-value" id="minutes">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          Пошуків
        </div>
        <div class="stat-value" id="searches">0</div>
      </div>
    </div>

    <button class="btn btn-primary" id="dashboard-btn">Відкрити дашборд</button>
    <button class="btn btn-secondary" id="logout-btn">Вийти</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
